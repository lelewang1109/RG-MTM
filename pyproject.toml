[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rg-mtm"
version = "1.0.0"
description = "Reference-Guided Merge Tree Maps and position-topology trade-off analysis"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.0.2",
  "scipy==1.13.1",
  "matplotlib==3.9.4",
  "Pillow==12.3.0",
  "netCDF4==1.7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
volume3d = ["hilbertcurve==2.0.5", "py7zr==1.1.4", "requests==2.34.2"]

