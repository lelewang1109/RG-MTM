name: Validate research snapshot
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/verify_release.py
      - run: python -m pip install -e './code[volume3d]'
      - name: Existing scientific and input-contract tests
        working-directory: code
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Saved submission tables and source identities
        working-directory: code
        env:
          PYTHONPATH: src
        run: python tools/build_submission20261023.py --check
