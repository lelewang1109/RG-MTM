name: Validate research snapshot
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/verify_release.py
      - run: python -m pip install -e './code[volume3d]' pymupdf==1.28.2
      - run: python -m pip install -r code/experiments/stmtm_completion/requirements.txt
      - name: Existing scientific and input-contract tests
        working-directory: code
        env:
          PYTHONPATH: src
        run: |
          mkdir -p ../paper/.build/unified20261025
          python -m unittest discover -s tests -v 2>&1 | tee ../paper/.build/unified20261025/tests.log
      - name: Frozen historical tables and source identities
        run: python tools/verify_historical_snapshot.py
      - name: Unified saved witnesses and historical evidence
        run: python paper/scripts/verify_unified_revision.py --numerical-only
      - name: Completed ST-MTM arrays and independent metrics
        run: python code/experiments/stmtm_completion/verify.py
